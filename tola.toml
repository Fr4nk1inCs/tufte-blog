# Tola configuration file (v0.8.1)
# https://github.com/tola-rs/tola-ssg

[site]
title = "Fr4nk1in's Blog"
authors = [{ name = "Fr4nk1in", email = "sh.fu@outlook.com" }]
description = "Fr4nk1in's Blog"
origin = "https://fr4nk1in.top"
base-path = "/"
language = "en"

[build]
entry = "site.typ"
content-dir = "content"
publish-dir = "public"

[build.references]
navigation = "error"
resources = "error"
fragments = "error"

[assets]
trees = [{ source = "assets", url-prefix = "/assets" }]
files = [{ source = "assets/files/resume.pdf", url = "/resume.pdf" }]

[typst.fonts]
paths = ["assets/fonts"]

[server]
interface = "127.0.0.1"
port = 5277

[dev]
watch = true
